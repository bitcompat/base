name: build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      build-args:
        type: string
        required: false
        default: ''
      cache-scope:
        type: string
        required: false
        default: 'buildkit'
      push:
        type: boolean
        required: false
        default: true
      version:
        type: string
        required: true
      major_only_tag:
        type: boolean
        default: false
        required: false
      revision:
        type: string
        required: false
        default: '1'
      debian_codename:
        type: string
        required: false
        default: trixie
      latest:
        type: boolean
        required: false
        default: false
      compatibility-service:
        type: string
        required: false
        default: ''
      buildkit_version:
        type: string
        required: false
        default: 0.23.2
    secrets:
      AWS_ROLE_ARN:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}-${{ inputs.name }}-${{ inputs.cache-scope }}
  cancel-in-progress: true

jobs:
  build_package_amd64:
      name: Build AMD64 Image - ${{ inputs.name }}
      runs-on: ubuntu-26.04

      steps:
          - uses: actions/checkout@master
            with:
                fetch-depth: 1

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
            with:
                driver-opts: |
                    image=moby/buildkit:v${{ inputs.buildkit_version }}

          - name: Build and Push container images
            uses: docker/build-push-action@v7
            with:
                platforms: linux/amd64
                build-args: |-
                    ${{ inputs.build-args }}
                    BUILD_VERSION=${{ inputs.version }}
                push: false
                load: ${{ vars.BITCOMPAT_DATABASE_COMPATIBILITY == 'true' && inputs.compatibility-service != '' }}
                tags: bitcompat-under-test:local
                cache-from: type=gha,scope=${{ inputs.cache-scope }}
                cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}

          - name: Checkout compatibility tests
            if: ${{ vars.BITCOMPAT_DATABASE_COMPATIBILITY == 'true' && inputs.compatibility-service != '' }}
            uses: actions/checkout@v6
            with:
                repository: bitcompat/base
                ref: main
                path: .bitcompat-compatibility
                sparse-checkout: tests/compatibility
                persist-credentials: false

          - name: Test container compatibility
            if: ${{ vars.BITCOMPAT_DATABASE_COMPATIBILITY == 'true' && inputs.compatibility-service != '' }}
            run: >-
                python3 .bitcompat-compatibility/tests/compatibility/run.py
                --service "${{ inputs.compatibility-service }}"
                --candidate bitcompat-under-test:local
                --version "${{ inputs.version }}"
                --platform linux/amd64
                --report compatibility-report.json

          - name: Upload compatibility report
            if: ${{ always() && vars.BITCOMPAT_DATABASE_COMPATIBILITY == 'true' && inputs.compatibility-service != '' }}
            uses: actions/upload-artifact@v7
            with:
                name: compatibility-${{ inputs.name }}-${{ inputs.version }}-amd64
                path: compatibility-report.json
                if-no-files-found: warn

  build_package_arm64:
      name: Build ARM64 Image - ${{ inputs.name }}
      runs-on: ubuntu-26.04-arm

      steps:
          - uses: actions/checkout@master
            with:
                fetch-depth: 1

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
            with:
                driver-opts: |
                    image=moby/buildkit:v${{ inputs.buildkit_version }}

          - name: Build and Push container images
            uses: docker/build-push-action@v7
            with:
                platforms: linux/arm64
                build-args: |-
                    ${{ inputs.build-args }}
                    BUILD_VERSION=${{ inputs.version }}
                push: false
                load: ${{ vars.BITCOMPAT_DATABASE_COMPATIBILITY == 'true' && inputs.compatibility-service != '' }}
                tags: bitcompat-under-test:local
                cache-from: type=gha,scope=${{ inputs.cache-scope }}-arm
                cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}-arm

          - name: Checkout compatibility tests
            if: ${{ vars.BITCOMPAT_DATABASE_COMPATIBILITY == 'true' && inputs.compatibility-service != '' }}
            uses: actions/checkout@v6
            with:
                repository: bitcompat/base
                ref: main
                path: .bitcompat-compatibility
                sparse-checkout: tests/compatibility
                persist-credentials: false

          - name: Test container compatibility
            if: ${{ vars.BITCOMPAT_DATABASE_COMPATIBILITY == 'true' && inputs.compatibility-service != '' }}
            run: >-
                python3 .bitcompat-compatibility/tests/compatibility/run.py
                --service "${{ inputs.compatibility-service }}"
                --candidate bitcompat-under-test:local
                --version "${{ inputs.version }}"
                --platform linux/arm64
                --report compatibility-report.json

          - name: Upload compatibility report
            if: ${{ always() && vars.BITCOMPAT_DATABASE_COMPATIBILITY == 'true' && inputs.compatibility-service != '' }}
            uses: actions/upload-artifact@v7
            with:
                name: compatibility-${{ inputs.name }}-${{ inputs.version }}-arm64
                path: compatibility-report.json
                if-no-files-found: warn

  build_package:
    name: Build package - ${{ inputs.name }}
    runs-on: ubuntu-26.04
    needs:
        - build_package_amd64
        - build_package_arm64

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 1

      - name: Install Cosign
        if: ${{ inputs.push == true }}
        uses: sigstore/cosign-installer@main

      - uses: bitcompat/compute-ghcr-revision-action@v1
        id: version-tags
        with:
          version: '${{ inputs.version }}'
          debian_codename: '${{ inputs.debian_codename }}'
          major_only_tag: ${{ inputs.major_only_tag && 'true' || 'false' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:v0.23.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        if: ${{ inputs.push == true && github.repository_owner == 'bitcompat' }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
        if: ${{ inputs.push == true && github.repository_owner == 'bitcompat' }}
        with:
          registry-type: public
          mask-password: 'true'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ inputs.push == true }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: docker_meta
        name: Extract docker image metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
            public.ecr.aws/bitcompat/${{ github.event.repository.name }},enable=${{ github.repository_owner == 'bitcompat' }}
          tags: |
            ${{ inputs.latest && 'latest' || '' }}
            ${{ steps.version-tags.outputs.tags }}
            type=sha
            type=sha,format=long

      - name: Build and Push container images
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          build-args: |-
            ${{ inputs.build-args }}
            BUILD_VERSION=${{ inputs.version }}
          push: ${{ inputs.push }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: |-
            type=gha,scope=${{ inputs.cache-scope }}
            type=gha,scope=${{ inputs.cache-scope }}-arm
          cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}

      - name: Setup CRANE
        if: ${{ inputs.push == true }}
        uses: imjasonh/setup-crane@v0.7

      - name: Login to ECR Public in CRANE
        if: ${{ inputs.push == true && github.repository_owner == 'bitcompat' }}
        run: crane auth login public.ecr.aws -u "${{ steps.login-ecr.outputs.docker_username_public_ecr_aws }}" -p "${{ steps.login-ecr.outputs.docker_password_public_ecr_aws }}"

      - name: Flatten images
        if: ${{ inputs.push == true }}
        id: flatten_images
        run: |
          set -euo pipefail
          DIGEST=""
          TAGS=$(echo "$DOCKER_METADATA_OUTPUT_JSON" | jq -r '.tags[]')
          while read -r IMG; do
            OUT=$(crane flatten "$IMG")
            HASH=$(echo "$OUT" | awk 'END{print}' | cut -d'@' -f2)
            [[ "$HASH" =~ ^sha256:[a-f0-9]{64}$ ]]
            DIGEST+="$IMG@$HASH "
          done <<< "$TAGS"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign image with a key
        run: |
          images=""
          for tag in ${DIGEST}; do
            images+="${tag} "
          done
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${images}
        if: ${{ inputs.push == true }}
        env:
          DIGEST: ${{ steps.flatten_images.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
